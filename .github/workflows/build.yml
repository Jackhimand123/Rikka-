name: Rikka V5 Final Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Environment
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm curl git

      - name: Setup Toolchain
        run: |
          mkdir -p toolchain
          cd toolchain
          wget https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz
          tar -xf master.tar.gz
          echo "PROTON_PATH=$(pwd)/proton-clang-master/bin" >> $GITHUB_ENV

      - name: Compile Kernel
        run: |
          mkdir -p out
          
          # 1. FORCE FIX: Remove incompatible Clang flags from the source
          # Deletes the trivial-auto flag and the regalloc-advisor flag causing the crash
          sed -i 's/-ftrivial-auto-var-init=zero//g' Makefile
          grep -rLI 'regalloc-enable-advisor' . | xargs -r sed -i 's/-regalloc-enable-advisor=release//g' || true
          
          export HOSTCC=gcc
          export HOSTCXX=g++
          export HOSTLDFLAGS="-fuse-ld=bfd"

          # 2. Generate Config
          make O=out ARCH=arm64 raphael_defconfig \
               CC=${{ env.PROTON_PATH }}/clang \
               HOSTCC=$HOSTCC \
               HOSTCXX=$HOSTCXX \
               HOSTLDFLAGS="$HOSTLDFLAGS"

          # 3. Build Kernel
          # We keep the acknowledgement flag for Clang 13+ safety
          make -j$(nproc --all) O=out \
               ARCH=arm64 \
               CC="${{ env.PROTON_PATH }}/clang -enable-trivial-auto-var-init-zero-knowing-it-will-be-removed-from-clang" \
               LD=${{ env.PROTON_PATH }}/ld.lld \

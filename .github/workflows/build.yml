name: Rikka V5 Final Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V5 Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Environment
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm curl git

      - name: Setup KernelSU (Manual Method)
        run: |
          # 1. Clean up any failed script attempts
          rm -rf drivers/staging/kernelsu
          
          # 2. Clone KernelSU directly into the root
          git clone https://github.com/tiann/KernelSU KernelSU
          cd KernelSU
          git checkout v0.9.5
          cd ..

          # 3. Manually add KernelSU to the Kconfig/Makefile (The reliable way)
          # Add to the bottom of the main Kconfig
          echo 'source "KernelSU/Kconfig"' >> arch/arm64/Kconfig
          # Add to the main Makefile
          echo 'obj-y += KernelSU/' >> Makefile

      - name: Setup Toolchain
        run: |
          mkdir -p toolchain
          cd toolchain
          wget https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz
          tar -xf master.tar.gz
          echo "TOOLCHAIN_PATH=$(pwd)/proton-clang-master/bin" >> $GITHUB_ENV

      - name: Compile Kernel
        run: |
          mkdir -p out
          
          # Force the use of system tools for 'fixdep' to avoid libc error
          export HOSTLDFLAGS="-fuse-ld=bfd"

          # 1. Generate Config
          make O=out ARCH=arm64 raphael_defconfig \
               HOSTCC=gcc \
               HOSTCXX=g++ \
               HOSTLDFLAGS="$HOSTLDFLAGS"

          # 2. Main Build
          # We use absolute paths for the Proton Clang tools
          make -j$(nproc --all) O=out \
               ARCH=arm64 \
               CC=${{ env.TOOLCHAIN_PATH }}/clang \
               CLANG_TRIPLE=aarch64-linux-gnu- \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
               LD=${{ env.TOOLCHAIN_PATH }}/ld.lld \
               AR=${{ env.TOOLCHAIN_PATH }}/llvm-ar \
               NM=${{ env.TOOLCHAIN_PATH }}/llvm-nm \
               OBJCOPY=${{ env.TOOLCHAIN_PATH }}/llvm-objcopy \
               OBJDUMP=${{ env.TOOLCHAIN_PATH }}/llvm-objdump \
               STRIP=${{ env.TOOLCHAIN_PATH }}/llvm-strip \
               HOSTCC=gcc \
               HOSTCXX=g++ \
               HOSTLDFLAGS="$HOSTLDFLAGS"

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Rikka-V5-Final-Build
          path: out/arch/arm64/boot/Image.gz-dtb

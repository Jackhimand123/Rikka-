name: Rikka V5 Clean Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Environment
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm curl git

      - name: Setup Toolchain
        run: |
          mkdir -p toolchain
          cd toolchain
          wget https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz
          tar -xf master.tar.gz
          echo "PROTON_PATH=$(pwd)/proton-clang-master/bin" >> $GITHUB_ENV

      - name: Compile Kernel
        run: |
          mkdir -p out
          export HOSTCC=gcc
          export HOSTCXX=g++
          export HOSTLDFLAGS="-fuse-ld=bfd"

          # 1. Generate Config
          make O=out ARCH=arm64 raphael_defconfig \
               CC=${{ env.PROTON_PATH }}/clang \
               CROSS_COMPILE=aarch64-linux-gnu- \
               HOSTCC=$HOSTCC \
               HOSTCXX=$HOSTCXX \
               HOSTLDFLAGS="$HOSTLDFLAGS"

          # 2. Forcefully Disable Stack Protector via script
          scripts/config --file out/.config -d CC_STACKPROTECTOR_STRONG
          scripts/config --file out/.config -e CC_STACKPROTECTOR_NONE

          # 3. Build Kernel
          make -j$(nproc --all) O=out \
               ARCH=arm64 \
               CC=${{ env.PROTON_PATH }}/clang \
               CLANG_TRIPLE=aarch64-linux-gnu- \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
               LD=${{ env.PROTON_PATH }}/ld.lld \
               AR=${{ env.PROTON_PATH }}/llvm-ar \
               NM=${{ env.PROTON_PATH }}/llvm-nm \
               OBJCOPY=${{ env.PROTON_PATH }}/llvm-objcopy \
               OBJDUMP=${{ env.PROTON_PATH }}/llvm-objdump \
               STRIP=${{ env.PROTON_PATH }}/llvm-strip \
               HOSTCC=$HOSTCC \
               HOSTCXX=$HOSTCXX \
               HOSTLDFLAGS="$HOSTLDFLAGS"

      - name: Upload Finished Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Rikka-V5-Clean-Build
          path: out/arch/arm64/boot/Image.gz-dtb

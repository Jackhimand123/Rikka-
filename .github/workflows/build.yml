name: Rikka V5 Final Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Environment
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm curl git

      - name: Manual KernelSU Integration
        run: |
          # 1. Download KernelSU v0.9.5 (Best for 4.14)
          git clone https://github.com/tiann/KernelSU KernelSU
          cd KernelSU && git checkout v0.9.5 && cd ..

          # 2. Add KernelSU to arch/arm64/Kconfig
          # This puts the KSU options in your kernel configuration
          echo 'source "KernelSU/Kconfig"' >> arch/arm64/Kconfig

          # 3. Add KernelSU to the root Makefile
          # This tells the compiler to actually enter the directory and build KSU
          echo 'obj-y += KernelSU/' >> Makefile

      - name: Setup Toolchain
        run: |
          mkdir -p toolchain
          cd toolchain
          wget https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz
          tar -xf master.tar.gz
          echo "TOOLCHAIN_PATH=$(pwd)/proton-clang-master/bin" >> $GITHUB_ENV

      - name: Compile Kernel
        run: |
          mkdir -p out
          # Use system linker for host tools to bypass the libc 0x13 error
          export HOSTLDFLAGS="-fuse-ld=bfd"

          # Step 1: Generate Config
          make O=out ARCH=arm64 raphael_defconfig \
               HOSTCC=gcc \
               HOSTCXX=g++ \
               HOSTLDFLAGS="$HOSTLDFLAGS"

          # Step 2: Main Build
          # Direct pathing to toolchain ensures system tools don't interfere with kernel code
          make -j$(nproc --all) O=out \
               ARCH=arm64 \
               CC=${{ env.TOOLCHAIN_PATH }}/clang \
               CLANG_TRIPLE=aarch64-linux-gnu- \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
               LD=${{ env.TOOLCHAIN_PATH }}/ld.lld \
               AR=${{ env.TOOLCHAIN_PATH }}/llvm-ar \
               NM=${{ env.TOOLCHAIN_PATH }}/llvm-nm \
               OBJCOPY=${{ env.TOOLCHAIN_PATH }}/llvm-objcopy \
               OBJDUMP=${{ env.TOOLCHAIN_PATH }}/llvm-objdump \
               STRIP=${{ env.TOOLCHAIN_PATH }}/llvm-strip \
               HOSTCC=gcc \
               HOSTCXX=g++ \
               HOSTLDFLAGS="$HOSTLDFLAGS"

      - name: Upload Finished Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Rikka-V5-KSU-Final
          path: out/arch/arm64/boot/Image.gz-dtb

name: Rikka V5 Final Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V5 Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # Faster checkout; only 0 if KSU patch fails

      - name: Setup Environment
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm curl git

      - name: Setup KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5

      - name: Setup Toolchain
        run: |
          mkdir toolchain
          cd toolchain
          wget https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz
          tar -xf master.tar.gz
          echo "$(pwd)/proton-clang-master/bin" >> $GITHUB_PATH

      - name: Compile Kernel
        run: |
          mkdir -p out
          
          # Fix for the 'unknown type 0x13' error: 
          # We tell the build to use the system linker (bfd) for host tools.
          export HOSTLDFLAGS="-fuse-ld=bfd"

          make O=out ARCH=arm64 raphael_defconfig \
               HOSTCC=gcc \
               HOSTCXX=g++

          make -j$(nproc --all) O=out \
               ARCH=arm64 \
               CC=clang \
               HOSTCC=gcc \
               HOSTCXX=g++ \
               CLANG_TRIPLE=aarch64-linux-gnu- \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
               LD=ld.lld \
               AR=llvm-ar \
               NM=llvm-nm \
               OBJCOPY=llvm-objcopy \
               OBJDUMP=llvm-objdump \
               STRIP=llvm-strip \
               HOSTLDFLAGS="$HOSTLDFLAGS"

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Rikka-V5-Final-Build
          path: out/arch/arm64/boot/Image.gz-dtb

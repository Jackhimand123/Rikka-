name: Kernel Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Set up proton-clang
      run: |
        git clone https://github.com/kdrag0n/proton-clang.git toolchain/proton-clang-master
        echo "$PWD/toolchain/proton-clang-master/bin" >> $GITHUB_PATH

    - name: Build kernel
      run: |
        export PATH="$PWD/toolchain/proton-clang-master/bin:$PATH"
        export CC=clang
        export HOSTCC=clang
        export HOSTCXX=clang++
        export LD=ld.lld
        export HOSTLD=ld.lld
        export CROSS_COMPILE=clang-
        make O=out ARCH=arm64 config/raphael_defconfig
        make O=out ARCH=arm64 -j$(nproc)

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kernel-build
        path: out/arch/arm64/boot/Image.gz-dtb

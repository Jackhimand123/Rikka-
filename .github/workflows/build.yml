name: Rikka V5 Final Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V5 Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Environment
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm curl git

      - name: Setup KernelSU
        run: |
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5

      - name: Setup Toolchain
        run: |
          mkdir -p toolchain
          cd toolchain
          wget https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz
          tar -xf master.tar.gz
          # We define the toolchain path but DON'T add it to GITHUB_PATH yet 
          # to prevent it from breaking the 'make' setup phase.
          echo "TOOLCHAIN_PATH=$(pwd)/proton-clang-master/bin" >> $GITHUB_ENV

      - name: Compile Kernel
        run: |
          mkdir -p out
          
          # 1. Generate Config using SYSTEM tools first to avoid the ld error
          make O=out ARCH=arm64 raphael_defconfig

          # 2. Main Build
          # We manually point to the Proton Clang binaries for the kernel code 
          # while letting the host use system GCC for scripts/basic/fixdep.
          make -j$(nproc --all) O=out \
               ARCH=arm64 \
               CC=${{ env.TOOLCHAIN_PATH }}/clang \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
               CLANG_TRIPLE=aarch64-linux-gnu- \
               LD=${{ env.TOOLCHAIN_PATH }}/ld.lld \
               AR=${{ env.TOOLCHAIN_PATH }}/llvm-ar \
               NM=${{ env.TOOLCHAIN_PATH }}/llvm-nm \
               OBJCOPY=${{ env.TOOLCHAIN_PATH }}/llvm-objcopy \
               OBJDUMP=${{ env.TOOLCHAIN_PATH }}/llvm-objdump \
               STRIP=${{ env.TOOLCHAIN_PATH }}/llvm-strip \
               HOSTCC=gcc \
               HOSTCXX=g++

      - name: Upload Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Rikka-V5-Final-Build
          path: out/arch/arm64/boot/Image.gz-dtb

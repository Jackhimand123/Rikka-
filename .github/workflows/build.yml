name: Rikka V5 Clean Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Environment
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          sudo apt-get update
          sudo apt-get install -y bc build-essential flex bison libssl-dev libelf-dev clang lld llvm curl git

      - name: Setup Toolchain
        run: |
          mkdir -p toolchain
          cd toolchain
          wget https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.tar.gz
          tar -xf master.tar.gz
          # Add toolchain to PATH so the compiler check can find it
          echo "$(pwd)/proton-clang-master/bin" >> $GITHUB_PATH
          echo "TOOLCHAIN_PATH=$(pwd)/proton-clang-master/bin" >> $GITHUB_ENV

      - name: Compile Kernel
        run: |
          mkdir -p out
          export HOSTLDFLAGS="-fuse-ld=bfd"

          # Step 1: Generate Config
          make O=out ARCH=arm64 raphael_defconfig \
               HOSTCC=gcc \
               HOSTCXX=g++ \
               HOSTLDFLAGS="$HOSTLDFLAGS"

          # Step 2: Main Build
          # We use the full toolchain here to avoid the Stack Protector error
          make -j$(nproc --all) O=out \
               ARCH=arm64 \
               CC=clang \
               CLANG_TRIPLE=aarch64-linux-gnu- \
               CROSS_COMPILE=aarch64-linux-gnu- \
               CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
               LD=ld.lld \
               AR=llvm-ar \
               NM=llvm-nm \
               OBJCOPY=llvm-objcopy \
               OBJDUMP=llvm-objdump \
               STRIP=llvm-strip \
               HOSTCC=gcc \
               HOSTCXX=g++ \
               HOSTLDFLAGS="$HOSTLDFLAGS"

      - name: Upload Finished Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Rikka-V5-Clean
          path: out/arch/arm64/boot/Image.gz-dtb
